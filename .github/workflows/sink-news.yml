# Sink news: rebuilds /news/ every morning from public RSS feeds (see .github/news/build_news.py).
# Also writes the 3 newest headlines into the home page (index.html, NEWS-STRIP markers).
# Commits only when the headlines change, then asks GitHub Pages to rebuild the site.
name: Sink news (daily)

on:
  schedule:
    - cron: '23 5 * * *'   # 05:23 UTC = 06:23 UK summer time (BST), 05:23 UK winter time (GMT)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sink-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch feeds, rebuild news/index.html and the home page's news strip
        run: python3 .github/news/build_news.py

      - name: Commit and push if the headlines changed
        id: commit
        run: |
          git add news/index.html index.html .github/news/archive.json
          if git diff --cached --quiet; then
            echo "No new headlines - nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sink news: daily update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase --quiet origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep 10
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" --jq .status
